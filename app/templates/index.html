<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172554;
        }

        header {
            background: #101d40;
            color: white;
            padding: 22px 8%;
        }

        main {
            max-width: 760px;
            margin: 80px auto;
            padding: 40px 24px;
            text-align: center;
            background: white;
            border-radius: 16px;
        }

        h1 {
            font-size: 36px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 18px;
            background: #e0f2fe;
            border-radius: 8px;
            color: #075985;
        }
    </style>
</head>

<body>
    <header>
        <strong>AI Resume Analyzer</strong>
    </header>

    <main>
        <h1>Build a Stronger Resume</h1>

        <p>
            Analyze your resume, compare it with a job description,
            identify missing skills, and discover ways to improve.
        </p>

        <div class="status">
            Our project is getting started!
        </div>
    </main>
</body>
</html>
